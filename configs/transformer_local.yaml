# ── Transformer-only local training config (Arc B580) ────────────────────────
# Run with: python -m src.train --config configs/transformer_local.yaml
#
# Single-scale backbone + transformer head. Similar VRAM to baseline.
# Slightly larger batch is safe since the transformer head is cheap.

model_type:   transformer
num_classes:  15
pretrained:   true
compile:      false

frames_per_clip: 15
frame_size:      224
batch_size:      4
grad_accum_steps: 2         # effective batch = 8
num_workers:     4
prefetch_factor: 2
cache:           true

optimizer:       adam
lr:              1.0e-4
weight_decay:    1.0e-4
label_smoothing: 0.1

epochs:              50
lr_decay_factor:     0.1
lr_decay_patience:   4
early_stop_patience: 10

splits_dir:     data/splits
processed_root: data/processed
checkpoint_dir: experiments/transformer/checkpoints
figure_dir:     experiments/transformer/figures
