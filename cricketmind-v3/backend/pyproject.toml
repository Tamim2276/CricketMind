[project]
name = "cricketmind-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tamim2276", email = "tamim2276007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
cricketmind-v3 = "cricketmind_v3:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
