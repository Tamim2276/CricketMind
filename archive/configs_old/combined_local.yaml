# configs/combined_local.yaml
# Combined model: MultiScaleEncoder (projected) + TemporalTransformer.
#
# This is the full proposed architecture targeting 89-93% accuracy.
#
# Architecture flow:
#   clip (B,15,3,224,224)
#     -> MultiScaleEncoder: features.3/5/7 -> pool -> concat(1504) -> proj(1280)
#     -> TemporalTransformerHead: pos_embed -> 2L/4H Transformer -> mean pool
#     -> BN -> FC(1024) -> ReLU -> Dropout(0.5) -> FC(15)
#
# VRAM note: MultiScaleEncoder uses ONE forward pass (FPN taps),
# not 3 separate passes. Combined with Transformer head this fits
# in 12GB with batch=4, grad_accum=2.
# If OOM: drop batch_size to 2 and grad_accum to 4.

model_type: combined
num_classes: 15
pretrained: true
compile: false
mimic_author: false

# DataLoader
frames_per_clip: 15
frame_size: 224
batch_size: 4
grad_accum_steps: 2 # effective batch = 8
num_workers: 0
prefetch_factor: 2
cache: false

# Optimizer
optimizer: adam
lr: 1.0e-4
backbone_lr_multiplier: 0.1
weight_decay: 5.0e-4
label_smoothing: 0.15

# Scheduler
scheduler: cosine
lr_decay_factor: 0.5
lr_decay_patience: 6

# Training
epochs: 60
early_stop_patience: 15

# Paths
splits_dir: data/splits
processed_root: data/processed
checkpoint_dir: experiments/combined/checkpoints
figure_dir: experiments/combined/figures
