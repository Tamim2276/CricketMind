# configs/transformer_local.yaml
# Single-scale FrameEncoder + TemporalTransformerHead
#
# Ablation: isolates Transformer contribution vs GRU baseline (72%)
# Architecture: EfficientNetV2-S (1280-d) -> Transformer(2L,4H) -> FC(15)
#
# Settings match baseline_local.yaml for fair comparison:
#   same backbone_lr, label_smoothing, weight_decay, dropout
#   MixUp disabled (hurt baseline, keeping consistent)

model_type: transformer
num_classes: 15
pretrained: true
compile: false
mimic_author: false

# DataLoader
frames_per_clip: 15
frame_size: 224
batch_size: 4
grad_accum_steps: 2
num_workers: 2
prefetch_factor: 2
cache: false

# Optimizer
optimizer: adam
lr: 1.0e-4
backbone_lr_multiplier: 0.5 # backbone LR = 5e-5 (same as baseline)
weight_decay: 5.0e-4
label_smoothing: 0.05 # same as baseline

# MixUp disabled (same as baseline for fair comparison)
use_mixup: false

# Scheduler
scheduler: cosine
lr_decay_factor: 0.5
lr_decay_patience: 6

# Training
epochs: 60
early_stop_patience: 15

# Paths
splits_dir: data/splits
processed_root: data/processed
checkpoint_dir: experiments/transformer/checkpoints
figure_dir: experiments/transformer/figures
